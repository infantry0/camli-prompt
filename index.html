<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Picker — 카메라 · 조명</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090d13;--s1:#111622;--s2:#181f2e;--s3:#1e2840;
  --b1:#1e2840;--b2:#2a3650;--b3:#3a4a6a;
  --text:#cdd6f4;--muted:#6272a4;--dim:#3a4060;
  --acc:#7aa2f7;--acc2:#bb9af7;--grn:#9ece6a;--yel:#e0af68;--red:#f7768e;--cyn:#7dcfff;--org:#ff9e64;
  --ok:rgba(122,162,247,0.15);--ok-b:#7aa2f7;
  --r:7px;--r2:11px;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;overflow:hidden}

/* ── 최상단 헤더 ── */
.topbar{
  display:flex;align-items:center;gap:0;
  padding:0 20px;height:52px;
  background:var(--s1);border-bottom:1px solid var(--b1);
  position:relative;z-index:10;
}
.logo{
  display:flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
  color:var(--muted);padding-right:20px;border-right:1px solid var(--b1);
  white-space:nowrap;
}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex-shrink:0}

/* ── 탭 ── */
.tabs{display:flex;align-items:stretch;gap:0;padding-left:8px;height:100%}
.tab{
  display:flex;align-items:center;gap:7px;
  padding:0 20px;cursor:pointer;
  font-size:12px;font-weight:700;
  color:var(--muted);
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
  white-space:nowrap;
  user-select:none;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--acc)}
.tab.active.light-tab{border-bottom-color:var(--org)}
.tab-icon{font-size:14px}
.tab-badge{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  background:var(--s2);border:1px solid var(--b2);
  border-radius:3px;padding:1px 5px;color:var(--muted);
}

/* ── 복사 영역 오른쪽 ── */
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.copy-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:var(--r);
  background:var(--s2);border:1px solid var(--b2);
  cursor:pointer;font-size:11px;font-weight:700;
  color:var(--muted);transition:all .15s;
  font-family:'Noto Sans KR',sans-serif;
}
.copy-btn:hover{border-color:var(--b3);color:var(--text)}
.copy-btn.cam-copy:hover,.copy-btn.cam-copy.flash{border-color:var(--acc);color:var(--acc)}
.copy-btn.light-copy:hover,.copy-btn.light-copy.flash{border-color:var(--org);color:var(--org)}
.copy-btn.both-copy:hover,.copy-btn.both-copy.flash{border-color:var(--grn);color:var(--grn)}
.copy-btn.flash{background:var(--s3)}

/* ── 레이아웃 ── */
.workspace{
  display:flex;height:calc(100vh - 52px);
  position:relative;
}

/* 단일 뷰 (카메라 or 조명) */
.single-view{
  position:absolute;inset:0;
  opacity:0;pointer-events:none;transition:opacity .2s;
  
  display:flex;
  flex-direction:column;
}
.single-view.visible{opacity:1;pointer-events:auto}

/* 분할 뷰 */
.split-view{
  position:absolute;inset:0;
  display:flex;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.split-view.visible{opacity:1;pointer-events:auto}

.split-pane{
  flex:1;display:flex;flex-direction:column;
  min-width:0;
}
.split-pane+.split-pane{border-left:2px solid var(--b2)}

.pane-label{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;
  background:var(--s2);border-bottom:1px solid var(--b1);
  font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
  flex-shrink:0;
}
.pane-label .dot{width:6px;height:6px;border-radius:50%}
.cam-dot{background:var(--acc)}
.light-dot{background:var(--org)}

iframe{
  width:100%;height:100%;border:none;background:var(--bg);
  display:block;
}

/* ── 리사이저 ── */
.resizer{
  width:4px;background:var(--b2);cursor:col-resize;
  flex-shrink:0;transition:background .15s;position:relative;z-index:5;
}
.resizer:hover,.resizer.dragging{background:var(--acc)}

/* ── 프롬프트 미리보기 패널 ── */
.preview-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--s1);border-top:1px solid var(--b1);
  padding:8px 16px;
  display:flex;align-items:center;gap:10px;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  z-index:20;
  max-height:44px;
  transition:max-height .25s ease;
}
.preview-bar.expanded{max-height:160px}
.preview-label{color:var(--muted);white-space:nowrap;flex-shrink:0}
.preview-text{
  color:var(--cyn);flex:1;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;
  cursor:pointer;
}
.preview-bar.expanded .preview-text{
  white-space:pre-wrap;word-break:break-all;
  overflow-y:auto;max-height:130px;
  align-self:flex-start;padding-top:2px;
}
.preview-toggle{
  flex-shrink:0;padding:3px 7px;border-radius:4px;
  background:var(--s2);border:1px solid var(--b2);
  color:var(--muted);cursor:pointer;font-size:9px;
  transition:all .12s;
}
.preview-toggle:hover{color:var(--text);border-color:var(--b3)}

/* 분할뷰일 때 하단 바 공간 확보 */
.workspace{padding-bottom:44px}
.workspace.preview-expanded{padding-bottom:160px}
</style>
</head>
<body>

<!-- ── 상단 탭바 ── -->
<div class="topbar">
  <div class="logo">
    <div class="logo-dot"></div>
    Prompt Picker
  </div>

  <div class="tabs">
    <div class="tab active" id="tabCam" onclick="switchTab('cam')">
      <span class="tab-icon">📷</span>
      카메라
      <span class="tab-badge">index1</span>
    </div>
    <div class="tab light-tab" id="tabLight" onclick="switchTab('light')">
      <span class="tab-icon">💡</span>
      조명
      <span class="tab-badge">index2</span>
    </div>
    <div class="tab" id="tabBoth" onclick="switchTab('both')">
      <span class="tab-icon">⚡</span>
      통합
    </div>
  </div>

  <div class="topbar-right">
    <!-- 카메라 탭 -->
    <button class="copy-btn cam-copy" id="btnCopyCam" onclick="copyPrompt('cam')" style="display:flex">
      📋 카메라 프롬프트 복사
    </button>
    <!-- 조명 탭 -->
    <button class="copy-btn light-copy" id="btnCopyLight" onclick="copyPrompt('light')" style="display:none">
      📋 조명 프롬프트 복사
    </button>
    <!-- 통합 탭 -->
    <button class="copy-btn both-copy" id="btnCopyBoth" onclick="copyPrompt('both')" style="display:none">
      📋 통합 복사
    </button>
  </div>
</div>

<!-- ── 작업 영역 ── -->
<div class="workspace" id="workspace">

  <!-- 카메라 단독 뷰 -->
  <div class="single-view visible" id="viewCam">
    <iframe id="frameCam" src="index1.html" title="카메라 피커"></iframe>
  </div>

  <!-- 조명 단독 뷰 -->
  <div class="single-view" id="viewLight">
    <iframe id="frameLight" src="index2.html" title="조명 피커"></iframe>
  </div>

  <!-- 분할 뷰 -->
  <div class="split-view" id="viewBoth">
    <div class="split-pane" id="paneLeft" style="flex:1">
      <div class="pane-label">
        <div class="dot cam-dot"></div>
        카메라 피커 — index1.html
      </div>
      <iframe id="frameCamB" src="" title="카메라 피커 (분할)"></iframe>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="split-pane" id="paneRight" style="flex:1">
      <div class="pane-label">
        <div class="dot light-dot"></div>
        조명 피커 — index2.html
      </div>
      <iframe id="frameLightB" src="" title="조명 피커 (분할)"></iframe>
    </div>
  </div>

</div>

<!-- ── 하단 프롬프트 미리보기 ── -->
<div class="preview-bar" id="previewBar">
  <span class="preview-label" id="previewLabel">📋 프롬프트</span>
  <div class="preview-text" id="previewText" onclick="togglePreview()">선택을 시작하면 프롬프트가 여기에 표시됩니다…</div>
  <div class="preview-toggle" onclick="togglePreview()" id="previewToggleBtn">펼치기</div>
</div>
<script>
'use strict';

// ── 상태 및 참조 ──────────────────────────────────────────────────────────────
let currentTab = 'cam';
let splitLoaded = false;
let camPrompt = '';
let lightPrompt = '';
let previewExpanded = false;

// 동기화용 상태 저장소 (index0 로직)
const syncState = {
  camera: { direction: null, height: null, tilt: null, distance: null, persons: null },
  lighting: { auto: {}, manual: {} }
};

// 모든 iframe 참조 정의
const frames = {
  cam: () => document.getElementById('frameCam'),
  light: () => document.getElementById('frameLight'),
  camB: () => document.getElementById('frameCamB'),
  lightB: () => document.getElementById('frameLightB')
};

// ── 탭 전환 ──────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tabCam').classList.toggle('active', tab === 'cam');
  document.getElementById('tabLight').classList.toggle('active', tab === 'light');
  document.getElementById('tabBoth').classList.toggle('active', tab === 'both');

  document.querySelectorAll('.single-view,.split-view').forEach(v => v.classList.remove('visible'));
  if (tab === 'cam') document.getElementById('viewCam').classList.add('visible');
  if (tab === 'light') document.getElementById('viewLight').classList.add('visible');
  if (tab === 'both') {
    document.getElementById('viewBoth').classList.add('visible');
    if (!splitLoaded) loadSplit();
  }

  // 복사 버튼 가시성
  document.getElementById('btnCopyCam').style.display   = tab === 'cam'   ? 'flex' : 'none';
  document.getElementById('btnCopyLight').style.display = tab === 'light' ? 'flex' : 'none';
  document.getElementById('btnCopyBoth').style.display  = tab === 'both'  ? 'flex' : 'none';

  updatePreview();
}

function loadSplit() {
  splitLoaded = true;
  frames.camB().src = 'index1.html';
  frames.lightB().src = 'index2.html';
}

// ── 통신 및 동기화 핵심 (index0 개선형) ──────────────────────────────────────────
function postToFrame(frame, payload) {
  if (frame && frame.contentWindow) {
    frame.contentWindow.postMessage(payload, '*');
  }
}

// 카메라 설정에 따른 조명 추천 로직 (Mapper)
function buildLightingSync(cam) {
  const result = { lightDirection: null, lightHeight: null, rim: null, ambient: null, softness: null };
  if (cam.direction === 'rear') { result.rim = 'strong'; result.lightDirection = 'back'; }
  if (cam.direction === 'front') result.lightDirection = 'front';
  if (cam.direction === 'side') result.lightDirection = 'side';
  if (cam.direction === 'front-side') result.lightDirection = 'front-side';
  if (cam.height === 'overhead') result.lightHeight = 'top';
  if (cam.height === 'low') result.lightHeight = 'under';
  if (cam.height === 'eye') result.lightHeight = 'eye';
  if (cam.distance === 'closeup') result.softness = 'soft';
  if (cam.distance === 'macro') result.softness = 'very-soft';
  if (cam.distance === 'fullbody') result.ambient = 'wide-fill';
  if (cam.tilt === 'dramatic') result.lightDirection = 'hard-side';
  if (cam.persons >= 3) result.ambient = 'scene-fill';
  return result;
}

// 모든 조명 iframe에 동기화 신호 전송
function syncLightingFromCamera() {
  const autoLighting = buildLightingSync(syncState.camera);
  syncState.lighting.auto = autoLighting;

  const payload = { type: 'LIGHTING_AUTO_SYNC', payload: autoLighting };
  postToFrame(frames.light(), payload);
  if (splitLoaded) postToFrame(frames.lightB(), payload);
}

// ── 메시지 수신 처리 ──────────────────────────────────────────────────────────
// home.html의 window.addEventListener('message', ...) 내부 수정
window.addEventListener('message', function(e) {
  if (!e.data) return;
  const data = e.data;

  // 1. 카메라(index1)에서 신호가 왔을 때
  if (data.type === 'CAM_PROMPT') {
    camPrompt = data.prompt || '';
    updatePreview();
  }

  if (data.type === 'CAM_SYNC') {
    // index1이 보낸 S값을 index2가 원하는 'CAM_STATE'로 즉시 전달
    const relayData = { type: 'CAM_STATE', state: data.payload };
    
    // 단일 뷰와 분할 뷰의 모든 조명 피커에 전달
    if (frames.light()) postToFrame(frames.light(), relayData);
    if (splitLoaded && frames.lightB()) postToFrame(frames.lightB(), relayData);
    
    // (선택 사항) 부모 창의 자체 추천 로직 실행
    syncLightingFromCamera(); 
  }

  // 2. 조명(index2)에서 신호가 왔을 때
  if (data.type === 'LIGHT_PROMPT') {
    lightPrompt = data.prompt || '';
    updatePreview();
  }
});

// ── 프롬프트 미리보기 & 복사 (기존 기능 유지) ──────────────────────────────────────
function updatePreview() {
  const el = document.getElementById('previewText');
  const lbl = document.getElementById('previewLabel');
  
  if (currentTab === 'cam') {
    lbl.textContent = '📷 카메라';
    el.textContent = camPrompt || '카메라를 선택하세요...';
  } else if (currentTab === 'light') {
    lbl.textContent = '💡 조명';
    el.textContent = lightPrompt || '조명을 선택하세요...';
  } else {
    lbl.textContent = '⚡ 통합 결과';
    // 두 값을 합치는 핵심 로직
    const combined = [camPrompt, lightPrompt].filter(Boolean).join('\n\n');
    el.textContent = combined || '카메라와 조명을 모두 선택하면 합쳐진 결과가 표시됩니다.';
  }
}

function copyPrompt(type) {
  let text = '';
  if (type === 'cam') text = camPrompt;
  if (type === 'light') text = lightPrompt;
  if (type === 'both') {
    // 결과값 사이에 구분선을 넣거나 섹션 이름을 붙여 합칩니다.
    const parts = [];
    if (camPrompt) parts.push("-- Camera Setup --\n" + camPrompt);
    if (lightPrompt) parts.push("-- Lighting Setup --\n" + lightPrompt);
    text = parts.join('\n\n');
  }
  if (!text) return;

  navigator.clipboard.writeText(text).then(() => {
    const btnId = {cam:'btnCopyCam', light:'btnCopyLight', both:'btnCopyBoth'}[type];
    const btn = document.getElementById(btnId);
    btn.classList.add('flash');
    const orig = btn.textContent;
    btn.textContent = '✓ 복사됨';
    setTimeout(() => { btn.classList.remove('flash'); btn.textContent = orig; }, 1500);
  });
}

function togglePreview() {
  previewExpanded = !previewExpanded;
  document.getElementById('previewBar').classList.toggle('expanded', previewExpanded);
  document.getElementById('workspace').classList.toggle('preview-expanded', previewExpanded);
  document.getElementById('previewToggleBtn').textContent = previewExpanded ? '접기' : '펼치기';
}

// ── 리사이저 (기존 기능 유지) ─────────────────────────────────────────────────
(function() {
  const resizer = document.getElementById('resizer');
  const pLeft = document.getElementById('paneLeft');
  const pRight = document.getElementById('paneRight');
  let dragging = false, startX = 0, leftW = 0;

  resizer.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX;
    leftW = pLeft.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const container = document.getElementById('viewBoth');
    const total = container.getBoundingClientRect().width - resizer.offsetWidth;
    const newLeft = Math.min(Math.max(leftW + dx, total * 0.2), total * 0.8);
    pLeft.style.flex = 'none'; pLeft.style.width = newLeft + 'px';
  });

  document.addEventListener('mouseup', () => {
    dragging = false; resizer.classList.remove('dragging');
    document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = '');
  });
})();

</script>
</body>
</html>
