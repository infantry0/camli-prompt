<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#07111f;color:#c0caf5;
  font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  font-size:13px;min-height:100vh;
  display:flex;flex-direction:column;
}
.top-bar{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;border-bottom:1px solid #1a2233;
  background:#0a1628;flex-shrink:0;
}
.top-bar h1{font-size:14px;font-weight:700;color:#c0caf5;white-space:nowrap}
.badge{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:#565f89;background:#1a1b26;
  border:1px solid #24283b;border-radius:4px;padding:1px 7px;
}
.tab-bar{
  display:flex;gap:0;padding:0 16px;
  background:#0a1628;border-bottom:1px solid #1a2233;flex-shrink:0;
}
.tab-btn{
  padding:8px 20px;border:none;background:transparent;
  color:#565f89;font-size:12px;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;transition:.15s;
  font-family:inherit;
}
.tab-btn:hover{color:#c0caf5}
.tab-btn.on{color:#7aa2f7;border-bottom-color:#7aa2f7}
.pane{display:none;flex:1;overflow:hidden}
.pane.on{display:flex;flex-direction:column}
iframe{
  width:100%;flex:1;border:none;
  background:#07111f;
}
.result-bar{
  background:#0d1117;border-top:1px solid #1a2233;
  padding:12px 16px;flex-shrink:0;
}
.result-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.result-label{
  font-size:10px;color:#565f89;font-weight:600;
  letter-spacing:.05em;white-space:nowrap;padding-top:3px;
}
.result-prompt{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:#c0caf5;line-height:1.7;flex:1;
  min-height:24px;word-break:break-all;
}
.result-prompt.empty{color:#3b4261;font-style:italic}
.btn-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn-copy{
  background:#7aa2f7;color:#07111f;border:none;border-radius:5px;
  padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;
}
.btn-copy:hover{opacity:.85}
.btn-reset{
  background:transparent;color:#565f89;
  border:1px solid #24283b;border-radius:5px;
  padding:5px 14px;font-size:11px;cursor:pointer;
}
.btn-reset:hover{color:#c0caf5;border-color:#414868}
.section-divider{
  font-size:10px;color:#414868;font-family:'JetBrains Mono',monospace;
  padding:0 4px;
}
.cam-prompt-area,.light-prompt-area{
  display:flex;align-items:flex-start;gap:6px;flex:1;min-width:0;
}
.sub-label{
  font-size:9px;color:#414868;font-weight:700;
  letter-spacing:.06em;white-space:nowrap;padding-top:4px;
  font-family:'JetBrains Mono',monospace;
}
</style>

<script>
let camPrompt   = '';
let lightPrompt = '';

// ── 탭 전환 ──
function showTab(tab) {
  ['cam','light'].forEach(t => {
    document.getElementById('pane-'  + t).classList.toggle('on', t === tab);
    document.getElementById('tab-'   + t + '-btn').classList.toggle('on', t === tab);
  });
}

// ── postMessage 수신 ──
window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  if (e.data.type === 'CAM_PROMPT') {
    camPrompt = e.data.prompt || '';
    // 카메라 상태를 조명 픽커로 전달
    if (e.data.state) {
      var ifl = document.getElementById('iframe-light');
      if (ifl && ifl.contentWindow) {
        ifl.contentWindow.postMessage({
          type: 'CAM_STATE',
          state: {
            height:  e.data.state.height  || null,
            dir:     e.data.state.dir     || null,
            frame:   e.data.state.dist    || null,
            tilt:    e.data.state.tilt    || null,
            persons: e.data.state.persons || null,
          }
        }, '*');
      }
    }
    updateResult();
  }
  if (e.data.type === 'LIGHT_PROMPT') {
    lightPrompt = e.data.prompt || '';
    updateResult();
  }
});

// ── 결과 갱신 ──
function updateResult() {
  var parts = [camPrompt, lightPrompt].filter(Boolean);
  var el    = document.getElementById('combined-out');
  var cam   = document.getElementById('cam-preview');
  var light = document.getElementById('light-preview');

  if (parts.length) {
    el.textContent = parts.join(', ');
    el.classList.remove('empty');
  } else {
    el.textContent = '카메라 또는 조명 설정 후 자동 생성됩니다.';
    el.classList.add('empty');
  }
  cam.textContent   = camPrompt   ? camPrompt.substring(0,60)   + (camPrompt.length   > 60 ? '…' : '')   : '—';
  light.textContent = lightPrompt ? lightPrompt.substring(0,60) + (lightPrompt.length > 60 ? '…' : '') : '—';
}

// ── 복사 ──
function copyCombined() {
  var text = [camPrompt, lightPrompt].filter(Boolean).join(', ');
  if (!text) return;
  navigator.clipboard.writeText(text).then(function() { flash('📋 통합 복사', '✅ 복사됨!'); });
}
function copyCam() {
  if (!camPrompt) return;
  navigator.clipboard.writeText(camPrompt).then(function() { flash('📷 카메라만', '✅ 복사됨!'); });
}
function copyLight() {
  if (!lightPrompt) return;
  navigator.clipboard.writeText(lightPrompt).then(function() { flash('💡 조명만', '✅ 복사됨!'); });
}
function flash(orig, msg) {
  var btns = document.querySelectorAll('.btn-copy');
  btns.forEach(function(b) { if (b.textContent === orig) { b.textContent = msg; setTimeout(function(){ b.textContent = orig; }, 1500); } });
}

// ── 전체 초기화 ──
function resetAll() {
  var ifc = document.getElementById('iframe-cam');
  var ifl = document.getElementById('iframe-light');
  if (ifc && ifc.contentWindow) ifc.contentWindow.postMessage({ type: 'CAM_RESET' }, '*');
  if (ifl && ifl.contentWindow) ifl.contentWindow.postMessage({ type: 'LIGHT_RESET' }, '*');
  camPrompt = ''; lightPrompt = '';
  updateResult();
}

// ── iframe 높이 자동 조정 ──
window.addEventListener('load', function() {
  // iframe 최소 높이를 뷰포트 기준으로
  function adjustHeight() {
    var vh = window.innerHeight;
    var topBar  = document.querySelector('.top-bar').offsetHeight;
    var tabBar  = document.querySelector('.tab-bar').offsetHeight;
    var resBar  = document.querySelector('.result-bar').offsetHeight;
    var h = vh - topBar - tabBar - resBar - 4;
    document.querySelectorAll('iframe').forEach(function(f) { f.style.height = h + 'px'; });
  }
  adjustHeight();
  window.addEventListener('resize', adjustHeight);
});
</script>
